# Breaking Money AI Trading Arena: configuration
# Everything is simulated. There is no setting that enables real orders.

[account]
starting_capital = 100000      # virtual rupees
challenge_days = 15            # the run stops after this many trading days

[market]
# Which exchange the Start button trades: "US" (NYSE / Nasdaq, USD) or "IN" (NSE, INR).
# Every agent can pick its own market; this is the default.
region = "US"
watchlist_us = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "TSLA", "AMD", "JPM", "SPY"]
# US market holidays (YYYY-MM-DD). Weekends are skipped automatically.
holidays_us = ["2026-11-26", "2026-12-25", "2027-01-01", "2027-01-18", "2027-02-15", "2027-03-26", "2027-05-31"]
# India: live price source "yahoo" (no signup) or "upstox" (free API, needs your Upstox login)
feed = "yahoo"
watchlist = ["RELIANCE", "TCS", "HDFCBANK", "INFY", "ICICIBANK", "SBIN", "BHARTIARTL", "ITC", "LT", "AXISBANK"]
# NSE trading holidays (YYYY-MM-DD). Weekends are skipped automatically.
# Copy the current list from the NSE website before you start a challenge.
holidays = []

[strategy]
# "balanced" uses the numbers below. "aggressive" = up to 3 concentrated positions of 35% each, 6% daily loss
# limit, and only A+ momentum breakouts with quick profit-taking (it overrides the matching settings below).
profile = "balanced"
# Who makes the calls: "auto" picks your Claude Code login (your Claude plan) if installed, else the free rules strategy.
# "claude-api" uses ANTHROPIC_API_KEY and is billed per use. It is never picked automatically.
# Or force one: "claude-cli", "claude-api", "rules"
brain = "auto"
model = "claude-opus-5-5"      # used by claude-api
effort = "medium"              # low | medium | high: how hard Claude thinks per decision
plan_only = true               # spending lock: refuse any Claude call your Claude plan does not cover
max_plan_used_pct = 80         # stop asking Claude once this much of the plan's 5-hour or weekly limit is used
cli_model = ""                 # optional --model for claude-cli: "", "sonnet", "opus" or "haiku"
decision_minutes = 15          # Claude is asked for calls this often
poll_seconds = 30              # prices are checked this often (stops/targets run on every poll)
bar_minutes = 5                # candle size used for indicators
product = "intraday"           # "intraday" = auto square-off every day; "delivery" = may hold overnight
square_off_time = "15:15"
no_new_entries_after = "14:45"
max_positions = 5
max_position_pct = 20          # max % of equity in one stock
default_stop_loss_pct = 1.5
default_target_pct = 3.0
max_daily_loss_pct = 3.0       # kill switch: close everything and stop entries for the day
# Short selling (paper): "off", "bear_only" (only while the desk reads a bear or panic market) or "always".
# Intraday only: every short is covered by square-off time.
short_mode = "bear_only"
short_margin_pct = 100.0       # cash blocked on top of the sale proceeds (100 = no leverage)
short_maintenance_pct = 30.0   # below this the engine covers by itself (margin call)
short_borrow_annual_pct = 3.0  # stock-borrow fee for the time held
max_shorts = 2
max_short_position_pct = 10.0  # % of equity per short
max_short_exposure_pct = 20.0  # % of equity, all shorts together
short_min_confidence = 0.65
short_max_stop_pct = 2.0
short_default_stop_pct = 1.2
short_default_target_pct = 2.0
# Free-text guidance passed to Claude. Use it to try different styles across the series.
notes = ""

[intel]
# World news and crowd emotion for the trading desk (public feeds, read-only, live sessions only).
enabled = true
refresh_minutes = 15           # one reading per market, shared by all agents
claude_emotion = true          # let Claude read the emotion (one extra Claude call per refresh)

[autopilot]
# Auto-run: start the US session every night and one India practice replay every trading day, by itself.
# Off by default. Turn it on in Settings. It uses your Claude plan's limits each day.
enabled = false
india_practice = true          # India is always practice, on prices more than 30 days old

[skills]
# Skills switched on for new agents. Change them on the Skills page; each agent then keeps its own selection.
enabled = ["news-scout", "emotion-analyst", "short-seller"]

[execution]
spread_bps = 4                 # assumed bid-ask spread; we cross half of it
slippage_bps = 3               # extra adverse slippage per order
impact_bps_per_pct_of_volume = 2   # extra cost per 1% of the bar's volume we take
max_participation = 0.05       # never fill more than 5% of a bar's volume
replay_latency_seconds = 60    # in replay, orders fill on the next bar after the decision

[charges]
# Indian equity charges. Check your broker's current schedule and update if rates change.
brokerage_intraday_pct = 0.03
brokerage_intraday_cap = 20.0
brokerage_delivery_pct = 0.0
brokerage_delivery_cap = 0.0
stt_intraday_sell_pct = 0.025
stt_delivery_pct = 0.1
exchange_txn_pct = 0.00297
sebi_per_crore = 10.0
stamp_intraday_buy_pct = 0.003
stamp_delivery_buy_pct = 0.015
gst_pct = 18.0
dp_charge_per_sell = 15.93

[charges_us]
# US equities at a commission-free broker. Regulatory fees apply to sells only.
commission_per_share = 0.0
commission_min = 0.0
sec_fee_per_million = 27.80
finra_taf_per_share = 0.000166
finra_taf_cap = 8.30

[report]
refresh_seconds = 60

[paths]
data_dir = "data"
db = "data/arena.db"
report = "reports/results.html"
log = "data/arena.log"

[safety]
paper_only = true              # cannot be changed; the program refuses to start otherwise
