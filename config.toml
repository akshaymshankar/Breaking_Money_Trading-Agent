# Breaking Money AI Trading Arena: configuration
# Everything is simulated. There is no setting that enables real orders.

[account]
starting_capital = 100000      # virtual rupees
challenge_days = 15            # the run stops after this many trading days

[market]
# Live price source: "yahoo" (no signup) or "upstox" (free API, needs your Upstox login)
feed = "yahoo"
watchlist = ["RELIANCE", "TCS", "HDFCBANK", "INFY", "ICICIBANK", "SBIN", "BHARTIARTL", "ITC", "LT", "AXISBANK"]
# NSE trading holidays (YYYY-MM-DD). Weekends are skipped automatically.
# Copy the current list from the NSE website before you start a challenge.
holidays = []

[strategy]
# "balanced" uses the numbers below. "aggressive" = up to 3 concentrated positions of 35% each, 6% daily loss
# limit, and only A+ momentum breakouts with quick profit-taking (it overrides the matching settings below).
profile = "balanced"
# Who makes the calls: "auto" picks your Claude Code login if installed, else an API key, else the free rules strategy.
# Or force one: "claude-cli", "claude-api", "rules"
brain = "auto"
model = "claude-opus-5-5"      # used by claude-api
effort = "medium"              # low | medium | high: how hard Claude thinks per decision
cli_model = ""                 # optional --model for claude-cli
gemini_model = ""              # battle mode: Gemini model to fight Claude ("" = newest stable Pro your key can use)
decision_minutes = 15          # Claude is asked for calls this often
poll_seconds = 30              # prices are checked this often (stops/targets run on every poll)
bar_minutes = 5                # candle size used for indicators
product = "intraday"           # "intraday" = auto square-off every day; "delivery" = may hold overnight
square_off_time = "15:15"
no_new_entries_after = "14:45"
max_positions = 5
max_position_pct = 20          # max % of equity in one stock
default_stop_loss_pct = 1.5
default_target_pct = 3.0
max_daily_loss_pct = 3.0       # kill switch: close everything and stop entries for the day
# Free-text guidance passed to Claude. Use it to try different styles across the series.
notes = ""

[execution]
spread_bps = 4                 # assumed bid-ask spread; we cross half of it
slippage_bps = 3               # extra adverse slippage per order
impact_bps_per_pct_of_volume = 2   # extra cost per 1% of the bar's volume we take
max_participation = 0.05       # never fill more than 5% of a bar's volume
replay_latency_seconds = 60    # in replay, orders fill on the next bar after the decision

[charges]
# Indian equity charges. Check your broker's current schedule and update if rates change.
brokerage_intraday_pct = 0.03
brokerage_intraday_cap = 20.0
brokerage_delivery_pct = 0.0
brokerage_delivery_cap = 0.0
stt_intraday_sell_pct = 0.025
stt_delivery_pct = 0.1
exchange_txn_pct = 0.00297
sebi_per_crore = 10.0
stamp_intraday_buy_pct = 0.003
stamp_delivery_buy_pct = 0.015
gst_pct = 18.0
dp_charge_per_sell = 15.93

[report]
refresh_seconds = 60

[paths]
data_dir = "data"
db = "data/arena.db"
report = "reports/results.html"
log = "data/arena.log"

[safety]
paper_only = true              # cannot be changed; the program refuses to start otherwise
